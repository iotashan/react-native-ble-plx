# Maestro flow: Scan → Pair → Sync (full happy path)
#
# Verifies the complete happy-path of discovering a BLE peripheral, connecting
# to it, discovering services, navigating to a readable characteristic, reading
# its value, and disconnecting cleanly.
#
# Prerequisites:
#   - The BlePlxTest peripheral is powered on and advertising within range.
#   - The test app is installed and foregrounded on the device under test.
#   - BLE permissions have been pre-granted (see README.md).
#   - See integration-tests/hardware/peripheral-firmware/README.md for firmware
#     requirements.
#
# Run:
#   maestro test integration-tests/hardware/maestro/scan-pair-sync.yaml

appId: com.bleplxexample

---

# ---------------------------------------------------------------------------
# 1. Launch the app fresh
# ---------------------------------------------------------------------------
- launchApp:
    clearState: true

# Wait for the scan screen buttons to be visible
- assertVisible:
    id: "scan-start-btn"
    timeout: 5000

# ---------------------------------------------------------------------------
# 2. Wait for BLE to be powered on, then start scanning
#
# The BLE state is displayed as inline text: "BLE State: PoweredOn".
# We wait for it to appear before scanning.
# ---------------------------------------------------------------------------
- assertVisible:
    text: "PoweredOn"
    timeout: 10000

- tapOn:
    id: "scan-start-btn"

# ---------------------------------------------------------------------------
# 3. Wait for the BlePlxTest peripheral to appear in the device list
# ---------------------------------------------------------------------------
- assertVisible:
    id: "device-list"

- assertVisible:
    text: "BlePlxTest"
    timeout: 15000

# ---------------------------------------------------------------------------
# 4. Tap the device row to connect
#
# The device row testID is device-item-{MAC/UUID}. Since the exact ID is
# unknown at authoring time, we tap by the displayed name instead.
# ---------------------------------------------------------------------------
- tapOn:
    text: "BlePlxTest"

# ---------------------------------------------------------------------------
# 5. Wait for the DeviceScreen to load
#
# The DeviceScreen shows the discover-btn once the connection is established.
# ---------------------------------------------------------------------------
- assertVisible:
    id: "discover-btn"
    timeout: 10000

# ---------------------------------------------------------------------------
# 6. Discover services
# ---------------------------------------------------------------------------
- tapOn:
    id: "discover-btn"

# The app alerts on discovery completion. Dismiss the alert.
- assertVisible:
    text: "Discovery"
    timeout: 8000
- tapOn:
    text: "OK"

# ---------------------------------------------------------------------------
# 7. Navigate to a characteristic
#
# If the service list is populated (future v4 API), tap the first visible
# characteristic. The testIDs follow the pattern char-{uuid}.
# For the read-counter characteristic on BlePlxTest firmware use the known UUID.
# ---------------------------------------------------------------------------
- tapOn:
    id: "char-fff1"

# ---------------------------------------------------------------------------
# 8. On CharacteristicScreen: read the value and verify it appears
# ---------------------------------------------------------------------------
- assertVisible:
    id: "read-btn"
    timeout: 5000

- tapOn:
    id: "read-btn"

# value-display starts as "(none)"; after a successful read it shows a base64
# encoded value. Assert it is no longer showing "(none)".
- assertVisible:
    id: "value-display"
    timeout: 5000
- assertNotVisible:
    text: "Value: (none)"

# ---------------------------------------------------------------------------
# 9. Navigate back and disconnect
# ---------------------------------------------------------------------------
- back

- assertVisible:
    id: "disconnect-btn"
    timeout: 5000

- tapOn:
    id: "disconnect-btn"

# After disconnecting, navigation returns to ScanScreen
- assertVisible:
    id: "scan-start-btn"
    timeout: 8000
