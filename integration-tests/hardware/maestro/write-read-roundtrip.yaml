# Maestro flow: Write → Read Roundtrip
#
# Verifies that a value written to the Write Echo characteristic (fff2 on
# BlePlxTest firmware) can be read back with the same content, confirming
# bidirectional characteristic I/O works end-to-end.
#
# Prerequisites:
#   - The BlePlxTest peripheral is powered on and advertising within range.
#   - The test app is installed and foregrounded on the device under test.
#   - BLE permissions have been pre-granted (see README.md).
#   - The BlePlxTest firmware implements a write-echo characteristic on fff2
#     that echoes back whatever value was last written.
#
# Run:
#   maestro test integration-tests/hardware/maestro/write-read-roundtrip.yaml

appId: com.bleplxexample

---

# ---------------------------------------------------------------------------
# 1. Launch the app and wait for BLE to be ready
# ---------------------------------------------------------------------------
- launchApp:
    clearState: true

- assertVisible:
    id: "scan-start-btn"
    timeout: 5000

- assertVisible:
    text: "PoweredOn"
    timeout: 10000

# ---------------------------------------------------------------------------
# 2. Scan and connect to BlePlxTest
# ---------------------------------------------------------------------------
- tapOn:
    id: "scan-start-btn"

- assertVisible:
    text: "BlePlxTest"
    timeout: 15000

- tapOn:
    text: "BlePlxTest"

- assertVisible:
    id: "discover-btn"
    timeout: 10000

# ---------------------------------------------------------------------------
# 3. Discover services and dismiss the alert
# ---------------------------------------------------------------------------
- tapOn:
    id: "discover-btn"

- assertVisible:
    text: "Discovery"
    timeout: 8000
- tapOn:
    text: "OK"

# ---------------------------------------------------------------------------
# 4. Navigate to the Write Echo characteristic (fff2)
# ---------------------------------------------------------------------------
- tapOn:
    id: "char-fff2"

- assertVisible:
    id: "write-input"
    timeout: 5000

# ---------------------------------------------------------------------------
# 5. Write a test value
#
# "Hello" base64-encoded is "SGVsbG8=". The write-input accepts base64 strings.
# ---------------------------------------------------------------------------
- tapOn:
    id: "write-input"
- clearText
- inputText: "SGVsbG8="

- tapOn:
    id: "write-btn"

# Dismiss the "Value written successfully" alert
- assertVisible:
    text: "Write"
    timeout: 5000
- tapOn:
    text: "OK"

# ---------------------------------------------------------------------------
# 6. Read back the value and verify it matches what was written
# ---------------------------------------------------------------------------
- tapOn:
    id: "read-btn"

# The value-display should now show the echoed base64 value
- assertVisible:
    id: "value-display"
    timeout: 5000
- assertVisible:
    text: "SGVsbG8="

# ---------------------------------------------------------------------------
# 7. Navigate back and disconnect
# ---------------------------------------------------------------------------
- back

- assertVisible:
    id: "disconnect-btn"
    timeout: 5000

- tapOn:
    id: "disconnect-btn"

- assertVisible:
    id: "scan-start-btn"
    timeout: 8000
